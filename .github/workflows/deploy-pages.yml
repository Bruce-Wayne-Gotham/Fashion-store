name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/affiliate-product-page-apple-ui-tuce58]
  # Image-workflow commits don't trigger this on purpose: images are reviewed
  # first, and the next normal push (or a manual run) deploys them.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/affiliate-product-page-apple-ui-tuce58

      - name: Collect site files
        run: |
          mkdir _site
          cp ./*.html ./*.css ./*.js _site/
          cp -r images _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
