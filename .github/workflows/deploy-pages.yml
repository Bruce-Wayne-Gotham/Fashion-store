name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/affiliate-product-page-apple-ui-tuce58]
  # Pushes made by the image workflow don't trigger `push`, so redeploy after it.
  workflow_run:
    workflows: ["Generate AI images"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/affiliate-product-page-apple-ui-tuce58

      - name: Collect site files
        run: |
          mkdir _site
          cp index.html styles.css app.js products.js _site/
          cp -r images _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
