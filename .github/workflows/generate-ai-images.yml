name: Generate AI images

# Run from the Actions tab → "Generate AI images" → Run workflow.
# Optional repository secrets (Settings → Secrets and variables → Actions):
#   HF_TOKEN              Hugging Face token (free) — tried first
#   POLLINATIONS_API_KEY  Pollinations key — used for the fallback if set
#   GEMINI_API_KEY        only for provider "gemini" (needs billing)
on:
  workflow_dispatch:
    inputs:
      names:
        description: "Only these images, space-separated (blank = all missing)"
        required: false
        default: ""
      force:
        description: "Regenerate images that already exist"
        type: boolean
        default: false
      provider:
        description: "Image provider"
        type: choice
        options: [auto, huggingface, pollinations, gemini]
        default: auto

permissions:
  contents: write

concurrency:
  group: generate-ai-images
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install huggingface_hub pillow google-genai

      - name: Generate images
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NAMES: ${{ inputs.names }}
          FORCE: ${{ inputs.force }}
          PROVIDER: ${{ inputs.provider }}
        run: |
          args=(--provider "${PROVIDER:-auto}")
          [ "$FORCE" = "true" ] && args+=(--force)
          # shellcheck disable=SC2086
          python3 tools/generate-ai-images.py "${args[@]}" $NAMES

      - name: Commit new images
        # Also runs when some images failed, so the ones that worked are kept.
        if: success() || failure()
        run: |
          git add -A images/ai 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new images to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add AI-generated product images"
          git push
